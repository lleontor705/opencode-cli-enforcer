# CodeQL static analysis for the plugin's TypeScript sources.
#
# `javascript-typescript` covers the whole language family and extracts directly
# from source, so no build step is required. The `security-extended` query suite
# is broader than the default, which is why this also runs on a weekly schedule
# rather than only on main-branch push and pull-request activity.
#
# Every `uses:` is pinned to a full commit SHA with the tag in a trailing
# comment; Dependabot's github-actions ecosystem keeps those pins moving.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "16 4 * * 2"

permissions:
  contents: read

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"