# Release pipeline for opencode-cli-enforcer.
#
# Triggered by pushing a version tag (`v*`). Verifies the package, then publishes
# to npm with provenance so consumers can trace the artifact back to this commit.
#
# `id-token: write` is mandatory for `npm publish --provenance` (OIDC), and
# `NODE_AUTH_TOKEN` is required by setup-node's registry auth wiring.
#
# The unit-test glob is left UNQUOTED so the shell expands it on Node 20, where
# `node --test` has no built-in glob support. exFAT/AppleDouble `._*` sidecars
# end in `.test.ts` too and would pollute discovery on exFAT checkouts, so they
# are purged first (same convention as ci.yml).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Purge AppleDouble sidecars
        run: |
          find tests -name '._*' -type f -delete
          find tests -name '.DS_Store' -type f -delete
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json present -> npm ci"
            npm ci
          else
            echo "package-lock.json not tracked -> npm install"
            npm install
          fi
      - name: Preflight (NPM_TOKEN configured)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN repository secret is not configured. Add it in Settings > Secrets and variables > Actions before pushing a v* tag."
            exit 1
          fi
      - name: Unit tests
        run: node --import tsx --test tests/**/*.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
