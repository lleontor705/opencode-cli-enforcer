# Release pipeline for opencode-cli-enforcer (CD).
#
# Triggered by pushing a version tag (`v*`). Tags are created by release-please
# (release-please.yml) when a Release PR is merged; they are never pushed by
# hand. Three least-privilege stages:
#   verify           -> tag/version + changelog gates, typecheck, tests, CycloneDX SBOM
#   publish          -> npm publish with provenance, gated by the `production` environment
#   github-release   -> attaches the SBOM to the bot-created release (create only as a fallback)
#
# Only the `publish` job asks for `id-token: write` (OIDC provenance / trusted
# publishing) and only `github-release` asks for `contents: write`. The top-level
# grant is read-only, so no job can inherit a write scope it does not use.
#
# Every `uses:` is pinned to a full commit SHA. Pinning matters most on the publish
# path: whatever runs there can reach the npm registry with a token, so a moved tag
# or a compromised action release is a supply-chain incident. The SBOM is attached
# with the preinstalled `gh` CLI rather than a third-party release action for the
# same reason: one less artifact in the trusted set. Each SHA comment records the
# upstream tag the pin corresponds to.
#
# `concurrency.cancel-in-progress` is false on purpose: cancelling a run midway
# through a publish can leave npm and the git tag in disagreeing states.
#
# The unit-test glob is left UNQUOTED so the shell expands it on Node 20, where
# `node --test` has no built-in glob support. exFAT/AppleDouble `._*` sidecars end
# in `.test.ts` too and would pollute discovery on exFAT checkouts, so they are
# purged first (same convention as ci.yml).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Purge AppleDouble sidecars
        run: |
          find tests -name '._*' -type f -delete
          find tests -name '.DS_Store' -type f -delete
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json present -> npm ci"
            npm ci
          else
            echo "package-lock.json not tracked -> npm install"
            npm install
          fi
      - name: Verify tag matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          PKG_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${REF_NAME} does not match package.json version ${PKG_VERSION}. Bump package.json and commit it, or push the matching tag."
            exit 1
          fi
          echo "Tag ${REF_NAME} matches package.json version ${PKG_VERSION}."
      - name: Verify CHANGELOG.md documents this version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          VERSION_ESCAPED="${VERSION//./\\.}"
          if ! grep -qE "^## \[?v?${VERSION_ESCAPED}\]?(\s|$|\()" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. Document the release before pushing the tag."
            exit 1
          fi
          echo "CHANGELOG.md documents ${VERSION}."
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: node --import tsx --test tests/**/*.test.ts
      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --sbom-type library --omit dev --package-lock-only > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The approval gate documented in CLAUDE.md: the required reviewers configured
    # on the `production` environment must approve before this job starts.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Token preflight (trusted publishing or NPM_TOKEN)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED_PUBLISHING" = "1" ]; then
            echo "OIDC trusted publishing is enabled (vars.NPM_TRUSTED_PUBLISHING == '1'); NPM_TOKEN is intentionally left unset so npm falls back to the OIDC identity."
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::vars.NPM_TRUSTED_PUBLISHING is not '1' and secrets.NPM_TOKEN is empty. Either add an npm automation token in Settings > Secrets and variables > Actions > Secrets, or set the NPM_TRUSTED_PUBLISHING repository variable to '1' and register this workflow as a trusted publisher on npmjs.com."
            exit 1
          fi
          echo "NPM_TOKEN is configured; publishing with the automation token."
      - name: Publish with provenance
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release (attach SBOM)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: .
      - name: Extract release notes from CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
          const fs = require("node:fs");
          const version = process.env.REF_NAME.replace(/^v/, "");
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const heading = new RegExp("^## \\[?" + escaped + "\\]?(\\s|$|\\()|^## v?" + escaped + "(\\s|$|\\()");
          const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
          const from = lines.findIndex((line) => heading.test(line));
          if (from === -1) {
            console.error("::error::CHANGELOG.md has no release section for " + version + "; refusing to publish empty release notes.");
            process.exit(1);
          }
          const next = lines.findIndex((line, index) => index > from && line.startsWith("## "));
          const notes = lines.slice(from, next === -1 ? lines.length : next).join("\n").trim();
          if (notes.length === 0) {
            console.error("::error::CHANGELOG.md section for " + version + " is empty; refusing to publish empty release notes.");
            process.exit(1);
          }
          fs.writeFileSync("notes.md", notes + "\n");
          console.log("Release notes for " + version + " written to notes.md.");
          '
      - name: Attach SBOM to the release (create it only as a fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            echo "Release $GITHUB_REF_NAME already exists (created by release-please); attaching the SBOM and leaving its notes untouched."
            gh release upload "$GITHUB_REF_NAME" sbom.cdx.json --clobber
          else
            echo "Release $GITHUB_REF_NAME does not exist; creating it from the changelog notes and attaching the SBOM."
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag sbom.cdx.json
          fi