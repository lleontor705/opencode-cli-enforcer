# OpenSSF Scorecard supply-chain security analysis for opencode-cli-enforcer.
#
# `publish_results: true` sends the signed result set to the public OpenSSF
# Scorecard API by exchanging the workflow's OIDC token, which is exactly why
# this job requests `id-token: write`. Publishing only works because this
# repository is public: a private repository cannot complete that OIDC exchange
# and the publish step fails.
#
# Findings are emitted as SARIF so GitHub code scanning renders them, and a copy
# is retained as a build artifact for post-hoc inspection.
#
# Every `uses:` is pinned to a full commit SHA with the human-readable tag in a
# trailing comment, so a hijacked action tag cannot change what runs here.
# Dependabot's github-actions ecosystem keeps those pins moving.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 3 * * 1"
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: "scorecard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14